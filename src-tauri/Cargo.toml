[package]
name = "arrangeit"
version = "1.6.0"
description = "ArrangeIt — local-first file organizer"
authors = ["mubareksam"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arrangeit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
sha2 = "0.10"
blake3 = "1"
lofty = "0.21"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
strsim = "0.11"
chrono = "0.4"
dirs = "5"

[target.'cfg(windows)'.dependencies]
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
