name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: ArrangeIt 1.3.0 (Windows x64)
          body: |
            **ArrangeIt 1.3.0** — local-first file organizer for Windows x64.

            Run `ArrangeIt_1.3.0_x64-setup.exe`. It **upgrades 1.2.0 in place**
            (same app id and install folder — you never end up with two copies).

            ### New in 1.3.0 — the "Frost" interface
            - **Glassmorphism throughout** — frosted, translucent panels with real backdrop
              blur, hairline top-light and layered shadows, over a slow-drifting aurora mesh
              with a film-grain overlay (kills gradient banding).
            - **Floating glass dock** for the six workspaces, with a glowing gradient pill on
              the active tab; the whole top bar is now a detached frosted bar.
            - **Glassy command palette (Ctrl+K)** — deeper blur, bloom around the panel, and
              a warm accent spotlight on the hovered row.
            - **Depth on interaction** — cards lift, rows sweep an accent gradient, primary
              buttons carry an inner highlight and a coloured glow.
            - **Four themes re-tuned for glass**: Dusk, Midnight, Amber and Paper (the light
              theme uses a frosted-white recipe so it stays crisp, not milky).
            - **Accessibility**: `prefers-reduced-motion` disables the aurora drift and all
              transitions; `prefers-contrast: more` thickens borders and drops translucency.

            Everything stays on your PC; deleted files go to the Recycle Bin.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
