name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ArrangeIt 1.0.0 (Windows x64)
          body: |
            **ArrangeIt 1.0.0** — local-first file organizer for Windows x64.

            Download `ArrangeIt_1.0.0_x64-setup.exe` below and run it. No Rust, Node or
            other tools needed — the installer bundles the app.

            Features: auto-arrange (date / type / size / similarity / name / extension),
            duplicate finder (SHA-256 + audio + image + fuzzy), batch rename,
            folder styles via desktop.ini, preview pane, four themes.

            The binary is unsigned, so Windows SmartScreen may show
            "More info → Run anyway" on first launch.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
