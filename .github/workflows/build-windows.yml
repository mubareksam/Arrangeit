name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0
          name: ArrangeIt 1.6.0 (Windows x64)
          body: |
            **ArrangeIt 1.6.0** — local-first file organizer for Windows x64.

            Run `ArrangeIt_1.6.0_x64-setup.exe`. It **upgrades 1.5.x in place**
            (same app id and install folder — you never end up with two copies).

            ### New: Smart arrange
            The Arrange tab now opens on **Smart**, which reads the folder instead of asking
            you to describe it. It weighs signature formats (.aep, .prproj, .als, .CR3) over
            generic ones, reads file names for deliverables ("final", "approved"), screenshots
            and installers, finds project folders from shared name stems, spots multi-year
            spans, and — when a folder genuinely holds two or three disciplines — splits it
            into `Design/`, `Video/`, `Audio/` and so on, each with that discipline's own
            folder roles. Folders for fields it does not model (legal, medical, teaching…)
            fall back to meaning-based generic folders: Contracts & Invoices, Final & Approved,
            Working Files, Documents, media, archives. Nothing is silent: the panel shows what
            it detected, with a confidence meter, the reasons, and a tree of the folders it
            will create.

            ### Rebuilt persona structures
            All 14 professions were rewritten from how practitioners actually file — studio
            folders for producers (Sessions · Stems · Bounces & Mixes · References · Samples &
            Loops · Audio Recordings · MIDI · Presets · Docs), numbered production folders for
            video (Footage · Audio · Project Files · Graphics · Proxies · LUTs · Exports), the
            date-first session tree photographers use, client/working/exports for designers,
            and conventional repository layout for developers. 56 structures in total.

            Numbers are applied at plan time, so a plan never ships `02_` and `05_` with
            nothing in between — only folders that receive files exist, numbered in the
            profession's own order.

            ### Fixed: desktop.ini stayed visible
            `desktop.ini` is no longer listed as a file (scans skip `desktop.ini`, `Thumbs.db`,
            `.DS_Store` and Office lock files), the hide step now *verifies* the hidden+system
            attributes and retries once, `[ViewState]` was dropped so Explorer stops rewriting
            the file and losing those flags, and turning the switch off makes it visible again.
            The switch now acts immediately on folders that already have an icon.

            ### Also
            - Plan folders are shown as a tree with the reason each one exists.
            - Persona cards, template chips with a ★ recommendation, and a one-click "Not
              listed? Smart" card.
            - Recycle Bin deletion and Ctrl+Z undo unchanged; in-place upgrade unchanged.

          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
