name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.1
          name: ArrangeIt 1.4.1 (Windows x64)
          body: |
            **ArrangeIt 1.4.1** — local-first file organizer for Windows x64.

            Run `ArrangeIt_1.4.1_x64-setup.exe`. It **upgrades 1.4.0 in place**
            (same app id and install folder — you never end up with two copies).

            ### New identity
            The generic "folder with an arrow" icon is gone. ArrangeIt now uses a single
            geometric **A** monogram — warm white on a frosted violet tile, with a soft light
            sweep and a diagonal sheen. A letter survives 16 px far better than any pictogram
            and no longer looks like every other file utility.

            The mark is generated, not hand-painted: `scripts/make-icon.mjs` renders the vector
            into a hand-built `.ico` (32-bit DIB at 16/24/32/48/64/128, PNG only at 256, because
            Windows ignores PNG entries below 256) plus every Store logo size, with a heavier
            stroke variant for the smallest sizes. `npm run icons` regenerates all of it in ~6 s.

            The in-app header uses the same geometry as live SVG, so the taskbar, the installer,
            the Start menu and the window title finally share one logo.

            Everything else is unchanged from 1.4.0: task-registry "working" fix, advanced
            duplicate finder (filters, keeper strategies, compare strip, CSV report), batched
            cancellable hashing and Fast mode.

            Everything stays on your PC; deleted files go to the Recycle Bin.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
