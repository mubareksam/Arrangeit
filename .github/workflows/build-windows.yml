name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: read

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
