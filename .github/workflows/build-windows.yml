name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          name: ArrangeIt 1.5.0 (Windows x64)
          body: |
            **ArrangeIt 1.5.0** — local-first file organizer for Windows x64.

            Run `ArrangeIt_1.5.0_x64-setup.exe`. It **upgrades 1.4.x in place**
            (same app id and install folder — you never end up with two copies).

            ### Arrange knows your job now
            13 professions — graphic designer, video editor, motion designer, animator,
            UI/UX designer, developer, student, business/admin, marketer, social media
            manager, photographer, musician and general — each with **four structures**:
            by role, role + year, project-first, and project-then-role. 52 structures in
            total. The app **auto-detects** the best fit from the extension mix (with a
            confidence figure and a one-click "Use …"), and marks the variant it recommends
            for the files actually on screen. You can always pick one by hand.

            ### Empty folders are impossible
            Only folders that receive a file are created. The planner drops no-op moves, and
            the Rust executor prunes any directory a failed move left behind — including
            nested `Project/Role` paths, which are now supported.

            ### Rename folders, not just files
            The Batch rename tab has a **Files / Folders** switch. Folders use the same
            pattern engine (`{name}`, `{counter}`, find/replace, case) with the same
            two-phase commit and the same Ctrl+Z undo — and no extension handling.

            ### Glass, not a window
            Surfaces are a real frosted texture now: a tinted body, fine grain, a lit top
            edge, and blur/saturation that fuses them with the aurora behind. Fast mode
            keeps the grain and drops only the blur cost.

            ### Insights you can click
            Every insight carries the ids of the files it is about: **Show N files** selects
            and highlights them in the list, and a new "largest file" insight jumps straight
            to the heaviest one in the folder.

            ### Duplicate review with a preview pane
            Click any copy in a group — thumbnail or row — and it opens in the right-hand
            preview pane for image, audio, video and text comparison. Matching is smarter
            too: a video "same cut" matcher (equal length within two seconds and the same
            frame size), a size-band boost for re-saved assets, and a guard against pairing
            a 200 KB file with a 40 MB one just because the names are alike.

            ### Smart audition (off by default)
            Turn it on with the **Audition** chip under the file list: the active file is
            previewed instantly, audio starts playing, and up/down arrows walk the folder
            while each track autoplays. Meant for sorting hundreds of sound files without an
            external player.

            ### Also
            - Category chips under the search field are the same height and baseline, with a
              scroll fade instead of clipped text.
            - **About** dialog (brand mark in the header, version in the status bar): version,
              shortcuts, privacy line, and **Developed by Qmer**.
            - Recycle Bin deletion and Ctrl+Z undo are unchanged, as is in-place upgrade.

          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
