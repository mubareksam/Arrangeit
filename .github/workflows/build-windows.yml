name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: ArrangeIt 1.1.0 (Windows x64)
          body: |
            **ArrangeIt 1.1.0** — local-first file organizer for Windows x64.

            Run `ArrangeIt_1.1.0_x64-setup.exe`. If 1.0.0 is already installed the
            installer **upgrades it in place** (same app id and install folder — you will
            not end up with two copies).

            **Fixed in this build**
            - Folder styles actually apply: 16/32/48/256 px `.ico`, quoted `IconResource`,
              `desktop.ini` attributes cleared before rewriting, `attrib +r/+s/+h`, cache flush.
            - Real previews: images, video playback, audio playback with a waveform decoded
              from the file (asset protocol enabled).
            - The file list only ever shows files from the folder you picked — the demo
              dataset is browser-only now, and the last folder is remembered.
            - Undo now moves files back on disk (`revert_files`).
            - `Remove style`, `Refresh Explorer` and CSV export added.
            - Calmer interface: compact toolbar, one primary action per tab, 4 themes in a menu.

            The binary is unsigned, so SmartScreen may ask for **More info → Run anyway**.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
