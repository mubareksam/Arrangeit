name: Windows installer

# Builds the NSIS installer on a real Windows runner and uploads it as a
# downloadable artifact, so nobody needs a Rust toolchain locally.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

jobs:
  build:
    name: Build ArrangeIt (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installer
        run: npx tauri build --bundles nsis

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ArrangeIt-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      # Publishes the .exe to the Releases page so it can be downloaded with one click.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: ArrangeIt 1.2.0 (Windows x64)
          body: |
            **ArrangeIt 1.2.0** — local-first file organizer for Windows x64.

            Run `ArrangeIt_1.2.0_x64-setup.exe`. It **upgrades 1.1.0 in place**
            (same app id and install folder — you will never end up with two copies).

            ### New in 1.2.0
            - **Folder Intelligence** — a to-do list for your folder: duplicates, screenshots,
              oversized media, stale downloads, installers, junk drawers, near-identical names
              and unstyled folders, each with a one-click plan you review first.
            - **Visually similar detection** — perceptual dHash, so resized or re-saved photos
              are still caught, not just byte-identical copies.
            - **Style any folder** — 25 icon glyphs × 16 presets, and you can pick a directory
              *anywhere* on your PC, not only subfolders of the scanned folder. "Auto-style"
              gives every folder a look based on what's actually inside it.
            - **Command palette (Ctrl+K)** — every action, tab, theme and folder in one search.
            - **Much faster** — metadata-only scanning (files are never opened), virtualised file
              list that stays smooth at 20 000+ files, hashing only runs when you ask for it.
            - Refreshed UI: breadcrumb path, SVG icon set, four themes, activity history with
              per-operation restore, and a preview pane that loads detail on demand.

            Everything stays on your PC; deleted files go to the Recycle Bin.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
